# اختبار قواعد أمان Firestore على محاكي Firebase — يعمل تلقائياً في GitHub
# يتأكد أن قواعد firestore.rules تسمح لكل دور بما يخصّه فقط قبل أي نشر.
name: اختبار قواعد أمان Firestore

on:
  push:
    paths:
      - "firestore.rules"
      - "firestore-tests/**"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firestore-tests/**"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch: {}

jobs:
  rules-test:
    name: تشغيل اختبارات القواعد
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: تهيئة Java (يحتاجها محاكي Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: تشغيل الاختبارات على المحاكي
        run: npm test
