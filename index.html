    /* --- فرق الإعدادات العامة (المالك فقط) --- */
    if(isOwner()){var core=fsCoreFields(S.config);var cs=jstr(core);
      if(cs!==FSY.shadowCfg){await db.collection("meta").doc("config").set(Object.assign({},core,{cfgUpdatedTs:Date.now()}),{merge:true});FSY.shadowCfg=cs;}}
    /* --- فرق الأدوار (المالك فقط) --- */
    if(isOwner())await fsPushRoles(db);
    setSync("on");S.sync.last=nowStamp();
  }catch(e){setSync("err");if(FSY.retryTimer)clearTimeout(FSY.retryTimer);FSY.retryTimer=setTimeout(fsPushNow,7000);}
}
async function fsPushRoles(db){var r=roster(),batch=db.batch(),n=0;
  Object.keys(r).forEach(function(em){var k=fsRoleKey(r[em]);if(k!==FSY.shadowRoles[em]){batch.set(db.collection("roles").doc(em),fsRoleDoc(r[em]));FSY.shadowRoles[em]=k;n++;}});
  Object.keys(FSY.shadowRoles).forEach(function(em){if(!r[em]){batch.delete(db.collection("roles").doc(em));delete FSY.shadowRoles[em];n++;}});
  if(n)await batch.commit();
}
async function fsTouchLogin(){var db=fsInit();if(!db||!S.currentUser||S.currentUser===OWNER_EMAIL)return;
  try{await db.collection("roles").doc(S.currentUser).set({lastLogin:nowStamp(),updatedTs:Date.now()},{merge:true});}catch(e){}}

/* الإقلاع: مصالحة أوّل تشغيل (دمج المحلي↔السحابي بلا فقدان) ثم ربط المستمعات اللحظية */
async function fsStart(){
  if(FSY.started)return true;var db=fsInit();if(!db)return false;
  setSync("busy");
  try{
    var daysSnap=await db.collection("days").get();
    var remoteDays={};daysSnap.forEach(function(d){remoteDays[d.id]=d.data()});
    var cfgDoc=await db.collection("meta").doc("config").get();
    var remoteCfg=(cfgDoc&&cfgDoc.exists)?cfgDoc.data():null;
    var rolesSnap=await db.collection("roles").get();
    var remoteRoles={};rolesSnap.forEach(function(d){remoteRoles[d.id]=d.data()});
    var remoteEmpty=(daysSnap.size===0)&&!remoteCfg&&(rolesSnap.size===0);

    /* (1) الأيام: لكل يوم، الأحدث بالطابع الزمني يفوز (المفقود محلياً يُعتمد سحابياً) */
    Object.keys(remoteDays).forEach(function(dt){var rd=remoteDays[dt],ld=S.data[dt];
      var rTs=num(rd.updatedTs)||0,lTs=(ld&&num(ld.updatedTs))||0;
      if(!ld||rTs>=lTs)S.data[dt]=rd;
      FSY.shadowDays[dt]=jstr(remoteDays[dt]);});
    /* الأيام المحلية فقط (غير موجودة سحابياً) تبقى وستُرفع لاحقاً */

    /* (2) الإعدادات العامة */
    if(remoteCfg){var rC=num(remoteCfg.cfgUpdatedTs)||0,lC=num(S.config.cfgUpdatedTs)||0;
      if(rC>=lC)FS_CFG_FIELDS.forEach(function(k){if(remoteCfg[k]!==undefined&&remoteCfg[k]!==null)S.config[k]=remoteCfg[k]});
      FSY.shadowCfg=jstr(fsCoreFields(remoteCfg));}
    else FSY.shadowCfg="";

    /* (3) الأدوار → إلى S.config.users (المالك مصدر الحقيقة؛ نعتمد الروستر السحابي إن وُجد) */
    if(rolesSnap.size){var merged={};Object.keys(remoteRoles).forEach(function(em){merged[em]=fsRoleToRoster(remoteRoles[em]);FSY.shadowRoles[em]=fsRoleKey(merged[em])});S.config.users=merged;}
    ensureOwner();
    if(S.currentUser&&S.currentUser!==OWNER_EMAIL){var me=roster()[S.currentUser];if(me)S.currentRole=me.role||S.currentRole;}

    /* (3.5) سجل النشاط + الاعتمادات (مجموعات منفصلة) */
    try{var actSnap=await db.collection("activity").get();S._activity=[];actSnap.forEach(function(d){S._activity.push(d.data())});S._activity.sort(function(a,b){return (num(b.ts)||0)-(num(a.ts)||0)});if(S._activity.length>200)S._activity=S._activity.slice(0,200);}catch(e){}
    try{var apprSnap=await db.collection("approvals").get();S._approvals={};apprSnap.forEach(function(d){S._approvals[d.id]=d.data()});}catch(e){}

    invalidateBal();await fsPersistQuiet();
    FSY.on=true;

    /* (4) ارفع المحلي الأحدث/الجديد (وهو «البذرة» عند أول ترحيل من جهاز المالك) */
    if(fsCanWrite()){
      if(remoteEmpty&&isOwner()){try{if(dbxEnabled())await dbxBackup();}catch(e){} S.config.fsMigratedAt=nowStamp();}
      await fsPushNow();
    } else {fsSyncShadowDays();}

    /* (5) المستمعات اللحظية */
    fsAttach(db);
    setSync("on");S.sync.last=nowStamp();FSY.started=true;return true;
  }catch(e){setSync("err");FSY.on=false;
    /* تبقى البيانات المحلية سليمة؛ إعادة المحاولة عند عودة الاتصال أو الظهور */
    return false;}
}

function fsAttach(db){
  /* أ) الأيام — تحديث لحظي */
  FSY.unsub.push(db.collection("days").onSnapshot(function(snap){
    if(FSY.applying)return;var changed=false,reload=false;
    snap.docChanges().forEach(function(ch){var doc=ch.doc;if(doc.metadata.hasPendingWrites)return;var dt=doc.id;
      if(ch.type==="removed"){if(S.data[dt]!==undefined){delete S.data[dt];delete FSY.shadowDays[dt];changed=true;if(S.day&&S.day.date===dt)reload=true;}}
      else{var data=doc.data();var s=jstr(data);if(s!==FSY.shadowDays[dt]){S.data[dt]=data;FSY.shadowDays[dt]=s;changed=true;
        if(S.day&&S.day.date===dt&&!(S.view==="entry"&&S.dirty))reload=true;}}
    });
    if(!changed)return;invalidateBal();
    fsPersistQuiet().then(function(){
      if(reload&&S.day)loadDay(S.day.date);
      if(S.view==="entry"&&S.dirty)updateSyncPill();else render();
      setSync("on");S.sync.last=nowStamp();});
  },function(){setSync("err");}));
  /* ب) الإعدادات العامة */
  FSY.unsub.push(db.collection("meta").doc("config").onSnapshot(function(doc){
    if(FSY.applying||!doc.exists||doc.metadata.hasPendingWrites)return;var core=doc.data();
    var cs=jstr(fsCoreFields(core));if(cs===FSY.shadowCfg)return;
    FS_CFG_FIELDS.forEach(function(k){if(core[k]!==undefined&&core[k]!==null)S.config[k]=core[k]});
    S.config.cfgUpdatedTs=num(core.cfgUpdatedTs)||Date.now();FSY.shadowCfg=cs;
    invalidateBal();fsPersistQuiet().then(function(){if(!(S.view==="entry"&&S.dirty))render();});
  },function(){}));
  /* ج) الأدوار — فرض الصلاحيات لحظياً (إيقاف/تغيير دور يُطبَّق فوراً) */
  FSY.unsub.push(db.collection("roles").onSnapshot(function(snap){
    if(FSY.applying)return;var r=roster(),changed=false;
    snap.docChanges().forEach(function(ch){if(ch.doc.metadata.hasPendingWrites)return;var em=ch.doc.id;
      if(ch.type==="removed"){if(r[em]){delete r[em];delete FSY.shadowRoles[em];changed=true;}}
      else{r[em]=fsRoleToRoster(ch.doc.data());FSY.shadowRoles[em]=fsRoleKey(r[em]);changed=true;}});
    if(!changed)return;ensureOwner();
    if(S.currentUser&&S.currentUser!==OWNER_EMAIL){var me=r[S.currentUser];
      if(!me||me.active===false){try{firebase.auth().signOut()}catch(e){}showLogin("تم تحديث صلاحياتك. تواصل مع المالك.");return;}
      S.currentRole=me.role||S.currentRole;if(!canSee(S.view))S.view="dashboard";}
    fsPersistQuiet().then(function(){if(!(S.view==="entry"&&S.dirty))render();});
  },function(){}));
  /* د) سجل النشاط — لحظي */
  FSY.unsub.push(db.collection("activity").onSnapshot(function(snap){
    if(FSY.applying)return;var ch=false;S._activity=S._activity||[];
    snap.docChanges().forEach(function(c){if(c.doc.metadata&&c.doc.metadata.hasPendingWrites)return;if(c.type==="removed")return;var d=c.doc.data();if(!d||!d.id)return;if(!S._activity.some(function(x){return x.id===d.id})){S._activity.push(d);ch=true;}});
    if(!ch)return;S._activity.sort(function(a,b){return (num(b.ts)||0)-(num(a.ts)||0)});if(S._activity.length>200)S._activity=S._activity.slice(0,200);if(!(S.view==="entry"&&S.dirty))render();
  },function(){}));
  /* هـ) الاعتمادات — لحظي */
  FSY.unsub.push(db.collection("approvals").onSnapshot(function(snap){
    if(FSY.applying)return;var ap=fsApprovals(),ch=false;
    snap.docChanges().forEach(function(c){if(c.doc.metadata&&c.doc.metadata.hasPendingWrites)return;var id=c.doc.id;if(c.type==="removed"){if(ap[id]){delete ap[id];ch=true}}else{ap[id]=c.doc.data();ch=true}});
    if(!ch)return;if(!(S.view==="entry"&&S.dirty))render();
  },function(){}));
}
/* إعادة مزامنة يدوية (زر «تحديث الآن») — المستمعات تحدّث تلقائياً، وهذا للطمأنة/الإنعاش */
async function fsResync(){if(!fsMode())return;if(!FSY.started){await fsStart();render();return;}
  try{var db=fsInit();if(!db)return;setSync("busy");
    var snap=await db.collection("days").get();var seen={};
    snap.forEach(function(d){seen[d.id]=1;var s=jstr(d.data());if(s!==FSY.shadowDays[d.id]){S.data[d.id]=d.data();FSY.shadowDays[d.id]=s;}});
    invalidateBal();await fsPersistQuiet();setSync("on");S.sync.last=nowStamp();render();toast("محدّث ✓");
  }catch(e){setSync("err");toast("تعذّر التحديث","err");}}

/* ===== سجل النشاط + الاعتمادات (مجموعات Firestore منفصلة — لا تمسّ حساب اليوم) ===== */
function updateNotif(){if(!(S.view==="entry"&&S.dirty)){try{render()}catch(e){}}}
function logEvent(type,detail,extra){try{
  var me=rosterGet(S.currentUser)||{};
  var ev=Object.assign({id:uuid(),ts:Date.now(),type:type||"info",actor:(S.currentUser||""),actorName:(me.name||S.currentUser||""),role:(myRole()||""),detail:detail||"",at:nowStamp()},extra||{});
  S._activity=S._activity||[];S._activity.unshift(ev);if(S._activity.length>200)S._activity=S._activity.slice(0,200);
  if(fsMode()&&FSY.on){var db=fsInit();if(db)try{db.collection("activity").doc(ev.id).set(ev).catch(function(){})}catch(e){}}
}catch(e){}}
function fsApprovals(){if(!S._approvals||typeof S._approvals!=="object")S._approvals={};return S._approvals}
function apprOf(date){return fsApprovals()[date]||null}
function apprStatus(date){var a=apprOf(date);if(a&&a.status)return a.status;var d=S.data[date];return (d&&d.status==="draft")?"draft":(d?"none":"none");}
async function fsSetApproval(date,obj){var cur=apprOf(date)||{};var m=Object.assign({date:date,submittedBy:"",submittedAt:"",decidedBy:"",decidedAt:"",reason:""},cur,obj,{updatedTs:Date.now()});
  fsApprovals()[date]=m;render();                       /* حدّث الواجهة فوراً (لا تنتظر الشبكة/الأوفلاين) */
  if(fsMode()&&FSY.on){var db=fsInit();if(db){try{await db.collection("approvals").doc(date).set(m)}catch(e){}}}
}

function loginHTML(){return "<div id='authGate' class='authgate'><form class='authcard' onsubmit='return App.login(event)'>"+
  "<div class='authlogo'>"+LOGO_SVG+"</div><h2>نظام تقارير اليومية</h2><p class='authsub'>الضبيبي التجارية · تسجيل الدخول</p>"+
  "<label class='authfld'><span>البريد الإلكتروني</span><input id='authEmail' type='email' inputmode='email' autocomplete='username' placeholder='name@dhtrd.com' required></label>"+
  "<label class='authfld'><span>كلمة المرور</span><span class='pwwrap'><input id='authPw' type='password' autocomplete='current-password' placeholder='••••••••' required><button type='button' class='pweye' onclick='App.pwReveal(this)'>👁</button></span></label>"+
  "<div id='authErr' class='autherr'></div><button type='submit' class='authbtn' id='authBtn'>تسجيل الدخول</button>"+
  "<div class='authnote'>لإعادة تعيين كلمة المرور تواصل مع المالك.</div></form></div>";}
function showLogin(msg){var g=document.getElementById("authGate");if(!g){var d=document.createElement("div");d.innerHTML=loginHTML();document.body.appendChild(d.firstChild);}document.documentElement.classList.add("authing");if(msg){var e=document.getElementById("authErr");if(e){e.textContent=msg;e.classList.add("show")}}}
function hideLogin(){var g=document.getElementById("authGate");if(g)g.remove();document.documentElement.classList.remove("authing");}

var _authStarted=false;
async function onSignedIn(user){
  var email=(user.email||"").toLowerCase();
  ensureOwner();
  /* هوية مبدئية قبل المزامنة كي تعمل منطق الصلاحيات بشكل صحيح أثناء المصالحة (الأمان الحقيقي على قواعد Firestore) */
  S.currentUser=email;
  S.currentRole=(email===OWNER_EMAIL)?"المالك":((rosterGet(email)&&rosterGet(email).role)||"مُدخِل اليوميات");
  /* المزامنة السحابية اللحظية: مصالحة + بذر + ربط المستمعات (تجلب أحدث الأدوار/البيانات قبل فحص الصلاحية) */
  if(fsMode()){try{await fsStart()}catch(e){}}
  else if(syncOn()){try{await cloudPull(true)}catch(e){}}
  ensureOwner();
  var entry=rosterGet(email);
  if(email!==OWNER_EMAIL){
    if(!entry){showLogin("هذا الحساب غير مُصرّح له بالدخول. تواصل مع المالك.");try{firebase.auth().signOut()}catch(e){}return;}
    if(entry.active===false){showLogin("حسابك موقوف حالياً. تواصل مع المالك.");try{firebase.auth().signOut()}catch(e){}return;}
  }
  S.currentUser=email;
  S.currentRole=(email===OWNER_EMAIL)?"المالك":((entry&&entry.role)||"مُدخِل اليوميات");
  if(fsMode()){fsTouchLogin();}                                   /* تحديث آخر دخول ذاتياً (مسموح بقواعد الأمان) */
  else{try{var me=rosterGet(email);if(me){me.lastLogin=nowStamp();saveConfig()}}catch(e){}}
  try{logEvent("login","سجّل الدخول")}catch(e){}
  hideLogin();
  if(!canSee(S.view))S.view="dashboard";
  loadDay(S.curDate);render();
  if(!_authStarted){_authStarted=true;registerSW();setupAutoSync();setupInstall();setupIdle();}
}
function startAuth(){
  if(!fbInit()){showLogin("تعذّر تحميل خدمة الدخول. تحقّق من اتصالك بالإنترنت ثم أعد فتح الصفحة.");return;}
  firebase.auth().onAuthStateChanged(function(user){if(user){onSignedIn(user);}else{if(_authStarted){location.reload();}else{showLogin();}}});
}

      "<button class='btn ghost' style='padding:6px 10px' onclick=\"App.usrToggle('"+em+"')\">"+(u.active===false?"▶ تفعيل":"⏸ إيقاف")+"</button>"+

    return "<div class='u-row"+(u.active===false?" u-off":"")+"' style='--rc:"+col+"'><div class='u-av'>"+esc((u.name||em||"?").slice(0,1))+"</div>"+

  }).join("");
  var addCard=h("div",{class:"card"},cardHead("إضافة مستخدم","يُنشأ حساب دخول ويُضاف للأدوار — يبقى دخولك أنت كما هو")+
    "<div class='u-add'>"+
    "<label class='fld' style='flex:1;min-width:140px'><span>الاسم</span><input id='uName' placeholder='اسم الموظف'></label>"+
    "<label class='fld' style='flex:1;min-width:170px'><span>البريد</span><input id='uEmail' type='email' placeholder='name@dhtrd.com'></label>"+
    "<label class='fld' style='min-width:130px'><span>كلمة مرور مؤقتة</span><input id='uPw' placeholder='6 أحرف على الأقل'></label>"+
    "<label class='fld' style='min-width:150px'><span>الدور</span><select id='uRole'>"+ASSIGN_ROLES.map(function(rr){return "<option>"+rr+"</option>"}).join("")+"</select></label>"+
    "<button class='btn' onclick='App.usrCreate()'>+ إنشاء الحساب</button></div>");
  return "<div class='v2users'>"+secHead("الفريق","المستخدمون")+h("div",{class:"grid"},addCard+h("div",{class:"card"},cardHead("المستخدمون والأدوار",emails.length+" مستخدم · عدد مفتوح")+rows))+"</div>";
}

function applyTheme(){try{var m=localStorage.getItem("dsr_mode")||"light";document.documentElement.setAttribute("data-mode",m==="dark"?"dark":"light");}catch(e){}}
function curTheme(){try{return localStorage.getItem("dsr_mode")||"light"}catch(e){return "light"}}
